<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" role="img" aria-labelledby="title desc">
<title id="title">CloudOps architecture</title>
<desc id="desc">Serverless incident management on AWS: CloudFront, Cognito, API Gateway, Lambda, DynamoDB, S3; EventBridge to Step Functions for P1 escalation and to an AI triage Lambda using Amazon Bedrock; CI/CD with GitHub Actions, OIDC and Terraform.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7c96"/></marker>
<style>
.t{font:600 15px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#e8e4dc}
.s{font:12.5px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#9aa7bb}
.l{font:italic 12px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#7f8ea6}
.g{font:600 12px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;fill:#5f7090}
.h{font:700 22px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#e8e4dc}
</style></defs>
<rect width="1280" height="900" rx="16" fill="#080a0f"/>
<text x="24" y="44" class="h">CloudOps <tspan fill="#f5a623">·</tspan> serverless incident management on AWS (eu-west-2)</text>
