<text x="36" y="92" class="g">REQUEST PATH</text>
<rect x="20" y="455" width="1240" height="200" rx="14" fill="#0e1420" stroke="#1d2738"/>
<text x="36" y="477" class="g">EVENT-DRIVEN: P1 ESCALATION + AI TRIAGE</text>
<rect x="20" y="670" width="1240" height="210" rx="14" fill="#0e1420" stroke="#1d2738"/>
<text x="36" y="692" class="g">CI/CD: GITHUB ACTIONS + TERRAFORM (NO STORED AWS KEYS)</text>
